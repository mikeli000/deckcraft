[package]
name = "deckcraft-livedoc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interop with Seismic LiveDocs, a real third-party PowerPoint add-in: recognizes its AD_HOC variable tokens on import and lets DeckCraft create its own"

[lints]
workspace = true

[dependencies]
deckcraft-model = { workspace = true }
deckcraft-pptx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# "Upload Live" only: a desktop-only, blocking HTTP client talking to one Seismic tenant. Never
# pulled into `deckcraft-web` (wasm32 has no std::thread to run a blocking call on).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
# Test-only: loads the repo-root `.env` for the `#[ignore]`d real-tenant smoke test in upload.rs.
dotenvy = { workspace = true }
