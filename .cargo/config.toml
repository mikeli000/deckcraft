# Local development builds embed the craft-fonts checkout next to this repo when it exists
# (build.rs warns and continues without it). CI and releases set CRAFT_FONTS_DIR explicitly.
[env]
CRAFT_FONTS_DIR = { value = "../craft-fonts", relative = true }

[alias]
xtask = "run --package xtask --"

# The browser build rasterizes slides on the CPU (vello_cpu) on the page's one thread. Without
# simd128 that code takes its scalar path: about twice as slow switching slides in a measured
# 10-slide deck. WebAssembly SIMD is in every current browser (Chrome 91, Firefox 89, Safari 16.4).
# A RUSTFLAGS environment variable replaces this, so set simd128 there too when you use one.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
